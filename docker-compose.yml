# ============================================================
# University Notice Board — Docker Compose
# ============================================================
# Start everything:  docker compose up --build
# Stop everything:   docker compose down
# Wipe volumes:      docker compose down -v
# ============================================================

services:
  # -------------------- Databases --------------------

  notice-db:
    image: mysql:8.0-debian
    container_name: notice-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NOTICE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NOTICE_DB_NAME}
      MYSQL_USER: ${NOTICE_DB_USER}
      MYSQL_PASSWORD: ${NOTICE_DB_PASSWORD}
    volumes:
      - notice-db-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${NOTICE_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  feedback-db:
    image: postgres:16-alpine
    container_name: feedback-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FEEDBACK_DB_NAME}
      POSTGRES_USER: ${FEEDBACK_DB_USER}
      POSTGRES_PASSWORD: ${FEEDBACK_DB_PASSWORD}
    volumes:
      - feedback-db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FEEDBACK_DB_USER} -d ${FEEDBACK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # -------------------- Microservices --------------------

  notice-service:
    build:
      context: ./notice-service
      dockerfile: Dockerfile
    container_name: notice-service
    restart: unless-stopped
    environment:
      DB_HOST: ${NOTICE_DB_HOST}
      DB_PORT: ${NOTICE_DB_PORT}
      DB_USER: ${NOTICE_DB_USER}
      DB_PASSWORD: ${NOTICE_DB_PASSWORD}
      DB_NAME: ${NOTICE_DB_NAME}
      PORT: ${NOTICE_SERVICE_PORT}
    depends_on:
      notice-db:
        condition: service_healthy
    networks:
      - backend

  feedback-service:
    build:
      context: ./feedback-service
      dockerfile: Dockerfile
    container_name: feedback-service
    restart: unless-stopped
    environment:
      DB_HOST: ${FEEDBACK_DB_HOST}
      DB_PORT: ${FEEDBACK_DB_PORT}
      DB_USER: ${FEEDBACK_DB_USER}
      DB_PASSWORD: ${FEEDBACK_DB_PASSWORD}
      DB_NAME: ${FEEDBACK_DB_NAME}
      PORT: ${FEEDBACK_SERVICE_PORT}
    depends_on:
      feedback-db:
        condition: service_healthy
    networks:
      - backend

  # -------------------- API Gateway --------------------

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    environment:
      PORT: ${GATEWAY_PORT}
      NOTICE_SERVICE_URL: ${NOTICE_SERVICE_URL}
      FEEDBACK_SERVICE_URL: ${FEEDBACK_SERVICE_URL}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      - notice-service
      - feedback-service
    networks:
      - frontend
      - backend

  # -------------------- Frontend --------------------

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - gateway
    networks:
      - frontend

# -------------------- Networks --------------------
networks:
  frontend:
    name: noticeboard-frontend
  backend:
    name: noticeboard-backend

# -------------------- Volumes --------------------
volumes:
  notice-db-data:
    name: noticeboard-notice-data
  feedback-db-data:
    name: noticeboard-feedback-data
