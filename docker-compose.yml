services:
  notice-service:
    build:
      context: ./notice-service
      dockerfile: Dockerfile
    container_name: notice-service
    restart: unless-stopped
    environment:
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_USER: ${NOTICE_DB_USER}
      DB_PASSWORD: ${NOTICE_DB_PASSWORD}
      DB_NAME: ${NOTICE_DB_NAME}
      PORT: "3001"
    ports:
      - "3001:3001"
    networks:
      - backend

  feedback-service:
    build:
      context: ./feedback-service
      dockerfile: Dockerfile
    container_name: feedback-service
    restart: unless-stopped
    environment:
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_USER: ${FEEDBACK_DB_USER}
      DB_PASSWORD: ${FEEDBACK_DB_PASSWORD}
      DB_NAME: ${FEEDBACK_DB_NAME}
      PORT: "5000"
    ports:
      - "5000:5000"
    networks:
      - backend

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    environment:
      PORT: "3000"
      NOTICE_SERVICE_URL: "http://notice-service:3001"
      FEEDBACK_SERVICE_URL: "http://feedback-service:5000"
    ports:
      - "3000:3000"
      - "8080:80"
    networks:
      - backend
      - frontend

networks:
  frontend:
    name: noticeboard-frontend
  backend:
    name: noticeboard-backend
