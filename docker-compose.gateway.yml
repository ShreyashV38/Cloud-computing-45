services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    environment:
      PORT: "3000"
      # For local testing, it uses the docker network names. 
      # On the cloud, this will be overridden by the external IPs.
      NOTICE_SERVICE_URL: ${NOTICE_SERVICE_URL:-http://notice-service:3001}
      FEEDBACK_SERVICE_URL: ${FEEDBACK_SERVICE_URL:-http://feedback-service:5000}
    ports:
      - "3000:3000"
      - "8080:80"
    networks:
      - noticeboard-network

networks:
  noticeboard-network:
    name: noticeboard-network
